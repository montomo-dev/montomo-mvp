<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="7つの世界でなかまに出会い、育てて配合するブラウザRPG。">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>モンとも 〜 なかまと そだてる ぼうけん 〜</title>
<link rel="stylesheet" href="css/style.css?v=20261002">
</head>
<body>
<main class="app-shell">
  <header class="site-header">
    <div>
      <h1>モンとも</h1>
      <p class="tagline">なかまと見つける、まだ知らない世界。</p>
    </div>
    <div class="status-stack" aria-label="ゲームの状態">
      <button id="pause-game" class="pause-button" aria-pressed="false">一時停止</button>
      <span class="status-chip" id="runtime-status" aria-live="polite">日本語・音あり</span>
    </div>
  </header>

  <div id="game-wrap">
    <canvas id="game" width="640" height="480" aria-label="モンとものゲーム画面"></canvas>
    <input id="name-input" maxlength="8" autocomplete="off" aria-label="ぼうけんしゃのなまえ" />
  </div>

  <section class="play-meta">
    <p class="save-note">3つのスロットへ自動保存。最初の画面で直接タップして選べます。</p>
    <details class="guide kbd-only">
      <summary>操作ガイド</summary>
      <div class="guide-grid">
        <span><kbd>↑↓←→</kbd> 移動・選択</span>
        <span><kbd>Z / Enter</kbd> 決定</span>
        <span><kbd>X / Esc</kbd> 戻る・パーティ</span>
        <span><kbd>D</kbd> 図鑑</span>
        <span><kbd>Q</kbd> 今日の目標</span>
        <span><kbd>W</kbd> ワープ</span>
        <span><kbd>M</kbd> 音</span>
        <span><kbd>L</kbd> 言語</span>
      </div>
    </details>
  </section>

  <nav id="dev-tools" hidden aria-label="検証ツール">
    <button data-dev-action="startFresh">検証用に開始</button>
    <button data-dev-action="placeNearBush">草の近くへ</button>
    <button data-dev-action="startBattle">戦闘へ</button>
    <button data-dev-action="command">コマンドへ</button>
    <button data-dev-action="weakenEnemy">敵を弱らせる</button>
    <button data-dev-action="returnField">フィールドへ</button>
    <button data-dev-action="title">タイトルへ</button>
    <output id="dev-state"></output>
  </nav>

  <div id="touch-controls">
    <div id="pad-row">
      <div id="dpad" aria-label="方向キー">
        <button class="dpad-btn dpad-up" data-action="up" aria-label="うえ">▲</button>
        <button class="dpad-btn dpad-left" data-action="left" aria-label="ひだり">◀</button>
        <button class="dpad-btn dpad-right" data-action="right" aria-label="みぎ">▶</button>
        <button class="dpad-btn dpad-down" data-action="down" aria-label="した">▼</button>
      </div>
      <div id="ok-cancel">
        <button class="round-btn cancel-btn" data-action="cancel" aria-label="もどる"><span>もどる</span><small>X</small></button>
        <button class="round-btn ok-btn" data-action="ok" aria-label="けってい"><span>決定</span><small>Z</small></button>
      </div>
    </div>
    <div id="misc-buttons">
      <button class="misc-btn" data-action="save" aria-label="セーブ">セーブ</button>
      <button class="misc-btn" data-action="dex" aria-label="図鑑">図鑑</button>
      <button class="misc-btn" data-action="quest" aria-label="きょうのもくひょう">目標</button>
      <button class="misc-btn" data-action="rename" aria-label="なまえ">名前</button>
      <button class="misc-btn" data-action="warp" aria-label="ワープ">ワープ</button>
      <button class="misc-btn" data-action="mute" aria-label="ミュート">音</button>
      <button class="misc-btn" data-action="lang" aria-label="言語切り替え">EN</button>
    </div>
  </div>
 </main>

<script type="module" src="js/main.js?v=20261002"></script>
<script type="module" src="./game-social/client.mjs" data-game-social-config="./game-social/config.json" data-game-social="game-social-runtime-v1"></script>
</body>
</html>
